[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gan-project-math4210"
version = "0.1.0"
description = "Reproducible GAN experiments on four synthetic and four image datasets"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "torchvision>=0.20,<1", "numpy>=1.26", "matplotlib>=3.8", "PyYAML>=6", "certifi>=2024.2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gan-project = "gan_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
